<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

      name="keywords"
      content="Solana, USDC, wallet, savings, Jupiter, self-custodial, mainnet"
    />
    <meta name="author" content="StashPot" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:image" content="https://stashpot-frontendd.vercel.app/stashpot-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="StashPot" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://stashpot-frontendd.vercel.app/" />

    <meta name="twitter:image" content="https://stashpot-frontendd.vercel.app/stashpot-logo.png" />

    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin />

    <!-- Inter + JetBrains Mono -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"

    />

    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "StashPot",

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "StashPot",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
